name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm publish --provenance --access public

      # GH release ≠ package publish (release-gh-release-vs-package-publish memory): node-release does
      # this for crew/garden, but installer's bespoke workflow published the tarball and cut NO GitHub
      # Release (0.4.2's was created by hand). Cut it from the CHANGELOG section, AFTER publish so a
      # release-cut glitch never blocks the package; idempotent (edit if it already exists).
      - name: GitHub Release from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$ver" 'index($0,"## ["v"] ")==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md)"
          [ -n "$notes" ] || notes="wicked-installer $ver"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf '%s\n' "$notes" | gh release edit "$GITHUB_REF_NAME" --notes-file -
          else
            printf '%s\n' "$notes" | gh release create "$GITHUB_REF_NAME" --title "wicked-installer $ver" --verify-tag --notes-file -
          fi
